<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --brand-blue: #2d59a4;
      --ink: #35465b;
      --muted: #758397;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #f5f8fc 0, #fff 260px);
      font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    }

    .topbar {
      height: 55px;
      background: var(--brand-blue);
      color: #fff;
      box-shadow: 0 2px 8px rgba(31, 62, 105, .18);
    }

    .topbar-inner {
      width: min(1076px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: inherit;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    .menu-toggle {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible {
      background: rgba(255, 255, 255, .14);
    }

    .menu-glyph,
    .menu-glyph::before,
    .menu-glyph::after {
      width: 18px;
      height: 2px;
      display: block;
      border-radius: 2px;
      background: currentColor;
    }

    .menu-glyph {
      position: relative;
    }

    .menu-glyph::before,
    .menu-glyph::after {
      position: absolute;
      left: 0;
      content: "";
    }

    .menu-glyph::before {
      top: -6px;
    }

    .menu-glyph::after {
      top: 6px;
    }

    .site-nav {
      position: absolute;
      z-index: 1100;
      top: 62px;
      right: max(20px, calc((100vw - 1076px) / 2));
      width: 236px;
      display: grid;
      gap: 2px;
      padding: 8px;
      border: 1px solid #e5eaf1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(31, 62, 105, .16);
    }

    .site-nav[hidden] {
      display: none;
    }

    .site-nav a,
    .nav-status {
      padding: 10px 12px;
      border-radius: 5px;
      color: var(--ink);
      font-size: 14px;
      text-decoration: none;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      background: #f0f5fc;
      color: var(--brand-blue);
    }

    .nav-status {
      border-top: 1px solid #edf0f4;
      color: var(--muted);
      font-size: 12px;
    }

    .page-shell {
      width: min(710px, calc(100% - 32px));
      margin: 0 auto;
      padding: 25px 0 44px;
    }

    @media (max-width: 480px) {
      .topbar-inner {
        width: calc(100% - 32px);
      }

      .brand {
        font-size: 18px;
      }

      .site-nav {
        right: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">防災アプリ</a>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">
        <span class="menu-glyph" aria-hidden="true"></span>
      </button>
    </div>
    <nav class="site-nav" id="siteNav" aria-label="メインナビゲーション" hidden>
      <a href="/">ホーム</a>
      <a href="/report_intake">通報整理</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
      {% if session.logged_in %}
        <span class="nav-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
        <a href="/logout">ログアウト</a>
      {% else %}
        <span class="nav-status">未ログイン</span>
        <a href="/login">ログイン</a>
      {% endif %}
    </nav>
  </header>

  <main class="page-shell">
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-toggle');
    const siteNav = document.getElementById('siteNav');

    menuButton.addEventListener('click', function() {
      const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
      menuButton.setAttribute('aria-expanded', String(!isExpanded));
      menuButton.setAttribute('aria-label', isExpanded ? 'メニューを開く' : 'メニューを閉じる');
      siteNav.hidden = isExpanded;
    });
  </script>
</body>
</html>
